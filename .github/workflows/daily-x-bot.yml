name: Daily Ababaya X posts

on:
  schedule:
    # 20:00 JST (GitHub Actions cron uses UTC).
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; set false to publish immediately"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-ababaya-x-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt
      - name: Verify post selection
        run: python -m unittest discover -s bot -p 'test_*.py'
      - name: Preview or publish
        run: python bot/daily_post.py
