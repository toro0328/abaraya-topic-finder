name: Daily Ababaya X posts

on:
  schedule:
    # GitHub scheduled workflows can start late. Start early, then the bot waits
    # inside the runner until exactly 20:00 JST before publishing.
    - cron: "30 10 * * *" # 19:30 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; set false to publish immediately"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-ababaya-x-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      WAIT_UNTIL_JST: ${{ github.event_name == 'schedule' && '20:00' || '' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt
      - name: Verify post selection
        run: python -m unittest discover -s bot -p 'test_*.py'
      - name: Preview or publish at 20:00 JST
        run: python bot/daily_post.py
