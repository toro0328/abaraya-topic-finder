name: Daily Ababaya X posts
on:
  schedule:
    - cron: '0 3 * * *' # 12:00 JST
    - cron: '0 11 * * *' # 20:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; set false to publish immediately
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: daily-ababaya-x-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * *' && 'true' || 'false') || inputs.dry_run }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt
      - name: Verify post selection
        run: python -m unittest discover -s bot -p 'test_*.py'
      - name: Check archive or publish within evening window
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '0 11 * * *' ]; then
            hour=$(TZ=Asia/Tokyo date +%H)
            if [ "$hour" != 20 ]; then
              echo 'Skipping delayed publication outside 20:00–20:59 JST.'
              exit 0
            fi
          fi
          python bot/daily_post.py
