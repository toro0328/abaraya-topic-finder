name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Add daily refresh helper, normalize archive records, and adjust navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="./daily-refresh.js?v=20261027"></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '\n</body>')
          needle = ").then(data=>fetch('./legacy-episodes.json?v=20261009-fix1')"
          patch = ").then(data=>{for(const e of data.episodes||[]){e.chapters??=[];e.tags??=[];e.mentions??=[];e.corners??=[];e.summary??=e.description||''}return data}).then(data=>fetch('./legacy-episodes.json?v=20261009-fix1')"
          if needle in html and patch not in html:
              html = html.replace(needle, patch, 1)

          # Always request the current archive rather than a stale browser/CDN cached copy.
          html = html.replace("fetch('./archive.json.gz.b64?v=20261009-fix1')", "fetch('./archive.json.gz.b64?v='+Date.now(),{cache:'no-store'})", 1)

          # Put the full episode archive first and make it the landing view.
          old_side = '<button class="nav active" data-view="topics">◉　話題から探す</button><button class="nav" data-view="videos">▶　動画から探す</button><button class="nav" data-view="episodes">▤　すべての回</button>'
          new_side = '<button class="nav active" data-view="episodes">▤　すべての回</button><button class="nav" data-view="videos">▶　動画から探す</button><button class="nav" data-view="topics">◉　話題から探す</button>'
          html = html.replace(old_side, new_side, 1)
          old_mobile = '<button class="on" data-view="topics">話題</button><button data-view="videos">動画</button><button data-view="episodes">全回</button>'
          new_mobile = '<button class="on" data-view="episodes">全回</button><button data-view="videos">動画</button><button data-view="topics">話題</button>'
          html = html.replace(old_mobile, new_mobile, 1)
          html = html.replace("let db=null,view='topics',topic='6秒ライブ'", "let db=null,view='episodes',topic='6秒ライブ'", 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
