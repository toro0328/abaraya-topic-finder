name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Add daily refresh helper and normalize archive records
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="./daily-refresh.js?v=20261027"></script>'
          if tag not in html:
              html = html.replace('</body>', tag + '\n</body>')
          needle = ").then(data=>fetch('./legacy-episodes.json?v=20261009-fix1')"
          patch = ").then(data=>{for(const e of data.episodes||[]){e.chapters??=[];e.tags??=[];e.mentions??=[];e.corners??=[];e.summary??=e.description||''}return data}).then(data=>fetch('./legacy-episodes.json?v=20261009-fix1')"
          if needle in html and patch not in html:
              html = html.replace(needle, patch, 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
