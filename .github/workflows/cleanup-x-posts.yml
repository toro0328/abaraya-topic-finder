name: Clean up X account posts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the account and post count only"
        required: true
        default: true
        type: boolean
      expected_count:
        description: "Required for deletion: type the exact count shown by the preview"
        required: false
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r bot/requirements.txt
      - name: Preview account and post count
        if: ${{ inputs.dry_run }}
        run: python bot/delete_all_posts.py
      - name: Delete all listed posts
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM_DELETE_COUNT: ${{ inputs.expected_count }}
        run: python bot/delete_all_posts.py --delete
